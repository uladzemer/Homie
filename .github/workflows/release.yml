# Сборка подписанного APK и публикация релиза.
# Запускается тегом вида v0.1.0 (версия должна совпадать с appVersionName в app/build.gradle.kts)
# или вручную из вкладки Actions — тогда APK только собирается и прикладывается к запуску.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Ключ подписи из секретов
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/homie-release.jks"

      - name: Сборка
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/homie-release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
          rm -f "$RUNNER_TEMP/homie-release.jks"

      - name: Проверка подписи
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: homie-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/*.apk \
            --title "Homie ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md
