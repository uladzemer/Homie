# Каталог зависимостей. Версии меняются только здесь.

[versions]
agp = "9.1.1"
kotlin = "2.4.10"
activity = "1.12.3"
compose-bom = "2026.06.01"
tv-material = "1.1.0-alpha01"

[libraries]
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-icons = { module = "androidx.compose.material:material-icons-extended" }
tv-material = { module = "androidx.tv:tv-material", version.ref = "tv-material" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
